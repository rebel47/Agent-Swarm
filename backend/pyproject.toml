[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "real_provider: opt-in paid inference; never runs without RUN_REAL_LLM_TESTS=1",
  "postgres: integration tests requiring TEST_POSTGRES_URL",
]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
